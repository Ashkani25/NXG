<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05030f"><title>NEXORA</title>
<style>
:root{--gold:#ffd86b;--vio:#a35bff;--cy:#42d9ff;--u:assets/ui}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030f;color:#fff;font-family:"Arial Black",Impact,"Trebuchet MS",system-ui,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.6px;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
img{-webkit-user-drag:none;user-select:none}
canvas{position:fixed;left:0;top:0;width:100vw;height:100dvh;z-index:0;touch-action:none}

/* ---------- motion ---------- */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(.72);opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(38px) rotateX(16deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 8px 16px rgba(255,60,220,.45))}50%{filter:drop-shadow(0 10px 26px rgba(255,90,235,.85))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- in-game HUD ---------- */
.hud{position:fixed;left:0;right:0;z-index:2;display:flex;justify-content:center;pointer-events:none}
.top{top:max(2px,env(safe-area-inset-top))}
.bot{bottom:max(8px,env(safe-area-inset-bottom));gap:10px;align-items:center}
.sb{position:relative;width:min(92vw,350px);height:98px;background:url(assets/ui/ban_thorn.webp) center/100% 100% no-repeat;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:29px 50px 27px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.team{display:flex;align-items:center;gap:6px;font-size:10px;opacity:.7;transition:.25s;min-width:0}
.team.r{flex-direction:row-reverse;text-align:right}
.team.on{opacity:1;color:var(--gold)}
.team img{width:34px;height:34px;flex:none;object-fit:contain;border-radius:50%;filter:drop-shadow(0 2px 4px #000)}
.team.on img{filter:drop-shadow(0 0 8px var(--gold))}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.score{display:flex;align-items:center;gap:5px;font-size:27px;line-height:1;color:var(--gold);text-shadow:0 0 12px #ff9a1f,0 2px 0 #3a1500;padding:0 6px}
.score i{font-style:normal;opacity:.7}
.chip{position:absolute;left:50%;top:calc(100% - 14px);transform:translateX(-50%);font-size:9px;white-space:nowrap;padding:3px 14px;border-radius:99px;background:rgba(14,6,40,.82);border:1px solid rgba(170,120,255,.55);color:#e2d2ff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.pillb{pointer-events:auto;position:relative;height:46px;min-width:112px;padding:0 20px 3px;font-size:13px;letter-spacing:1px;text-shadow:0 2px 4px #000a;background:url(assets/ui/pill_purple.webp) center/100% 100% no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));transition:transform .15s}
.pillb.pk{background-image:url(assets/ui/pill_pink.webp)}
.rb{pointer-events:auto;width:50px;height:54px;background:url(assets/ui/i_sound.webp) center/contain no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));transition:.2s}
.rb.off{filter:grayscale(1) brightness(.6) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.pillb:active,.rb:active{transform:translateY(2px) scale(.95)}

.toast{position:fixed;top:24%;left:50%;transform:translateX(-50%) scale(.6);z-index:20;opacity:0;transition:.3s cubic-bezier(.2,1.4,.3,1);padding:11px 26px;border-radius:99px;background:linear-gradient(135deg,rgba(90,45,215,.96),rgba(32,10,110,.96));border:1.5px solid #c9a5ff;box-shadow:0 0 28px #8a4bff,0 14px 30px rgba(0,0,0,.5);font-size:17px;white-space:nowrap;pointer-events:none}
.toast.g{font-size:38px;padding:10px 34px;background:linear-gradient(135deg,#ffe28a,#ff8a1f);color:#2a0d00;border-color:#fff2b0;box-shadow:0 0 46px #ff9a1f,0 14px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

.over{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 38%,rgba(70,25,150,.78),rgba(3,0,14,.93) 70%)}
.over.show{display:flex}
.chest{position:relative;width:min(56vw,230px);margin-bottom:14px}.chest img{width:100%;display:block;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,190,60,.6))}
.sh{position:absolute;left:14%;right:14%;bottom:-16px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);animation:shd 3.6s ease-in-out infinite;pointer-events:none}
.plate{width:min(90vw,380px);height:104px;background:url(assets/ui/ban_thorn.webp) center/100% 100% no-repeat;display:grid;place-items:center;padding:0 46px;text-align:center;font-size:17px;line-height:1.15;color:var(--gold);text-shadow:0 0 12px #ff9a1f,0 2px 0 #3a1500;margin-bottom:8px}
.big{position:relative;width:min(70vw,260px);aspect-ratio:2.8;font-size:19px;letter-spacing:2px;text-shadow:0 2px 6px #000a;background:url(assets/ui/pill_purple.webp) center/100% 100% no-repeat;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));padding-bottom:4px;transition:transform .15s}
.big.pk{background-image:url(assets/ui/pill_pink.webp);animation:pulse 2.8s ease-in-out infinite}
.big.sm{width:min(52vw,200px);font-size:16px;flex:none}
.big:active{transform:translateY(2px) scale(.96)}

/* ---------- screens ---------- */
.scr{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:#06021a url(assets/ui/bg_sub.jpg) center/cover no-repeat;perspective:1000px;overflow:hidden}
.scr.show{display:flex}
.xb{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;width:50px;height:50px;z-index:3;background:url(assets/ui/b_close.webp) center/contain no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));animation:bob2 4s ease-in-out infinite}
.xb:active{transform:scale(.92)}
.hdr{flex:none;width:min(66vw,250px);height:78px;background:url(assets/ui/ban_thorn.webp) center/100% 100% no-repeat;display:grid;place-items:center;padding:0 34px;font-size:15px;letter-spacing:1.5px;color:var(--gold);text-shadow:0 0 10px #ff9a1f,0 2px 0 #3a1500;white-space:nowrap;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));animation:bob2 5s ease-in-out infinite;margin-top:2px}
.scr.show .panel{animation:rise .55s cubic-bezier(.2,1.1,.3,1) both;transform-origin:50% 100%}
.panel{position:relative;width:min(94vw,520px);flex:1;min-height:0;margin-top:6px;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 12px 12px;border-radius:28px;background:linear-gradient(160deg,rgba(44,20,100,.66),rgba(10,4,36,.82));border:1.5px solid rgba(175,125,255,.5);box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 44px rgba(130,70,255,.35),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 44px rgba(110,60,255,.16)}
.panel>.big{align-self:center}
.panel h4{margin:6px 4px 2px;font-size:11px;letter-spacing:3px;color:#c9b2ff}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:none;padding:2px}.scroll::-webkit-scrollbar,.grid::-webkit-scrollbar{display:none}

.tabs{display:flex;gap:8px;flex:none}
.tab{flex:1;height:44px;font-size:11px;letter-spacing:1px;padding:0 12px 3px;background:url(assets/ui/pill_purple.webp) center/100% 100% no-repeat;opacity:.72;transition:.2s;text-shadow:0 2px 4px #000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background-image:url(assets/ui/pill_pink.webp);opacity:1;transform:translateY(-2px);filter:drop-shadow(0 6px 10px rgba(255,60,220,.5))}
.cats{overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding-bottom:4px}.cats::-webkit-scrollbar{display:none}
.cats .tab{flex:0 0 auto;min-width:92px;height:40px}
.tvs{display:flex;align-items:flex-end;justify-content:center;gap:6px;flex:none;perspective:620px;height:138px;position:relative;transform:rotateY(calc(var(--px,0)*9deg)) rotateX(calc(var(--py,0)*-4deg));transform-style:preserve-3d;transition:transform .25s ease-out}
.tvs em{font-style:normal;color:var(--gold);font-size:22px;padding-bottom:46px;text-shadow:0 0 14px #ff9a1f,0 3px 0 #3a1500;transform:translateZ(30px)}
.tv{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;opacity:.55;transition:opacity .25s,transform .35s cubic-bezier(.2,1.3,.3,1);font-size:10px;position:relative;transform-style:preserve-3d;text-align:center}
.tv::before{content:"";position:absolute;left:50%;top:2px;width:126px;height:126px;margin-left:-63px;background:radial-gradient(closest-side,rgba(255,200,90,0),transparent);transition:.3s;pointer-events:none}
.tv::after{content:"";position:absolute;left:50%;bottom:20px;width:104px;height:22px;margin-left:-52px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);transform:translateZ(-30px)}
.tv.on{opacity:1;transform:translateY(-5px) translateZ(26px) scale(1.07)}
.tv.on::before{background:radial-gradient(closest-side,rgba(255,200,90,.5),transparent)}
.coin{width:88px;height:88px;position:relative;transform-style:preserve-3d;animation:coinspin 7s linear infinite;will-change:transform}
.tv.r .coin{animation-direction:reverse}
.coin i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#ffe58a,#d9a021 45%,#7b4f0c);transform:translateZ(calc(var(--k)*1.6px))}
.coin img{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;padding:15%;object-fit:contain;border-radius:50%;background:radial-gradient(circle,#2a1670 0,#150a45 62%,#f4cd57 64%,#b07a1a 100%);backface-visibility:hidden}
.coin .cf{transform:translateZ(8.4px)}.coin .cb{transform:rotateY(180deg) translateZ(8.4px)}
.coin.flip{animation:coinflip .9s cubic-bezier(.2,.8,.25,1),coinspin 7s linear .9s infinite}
.tv.r .coin.flip{animation:coinflip .9s cubic-bezier(.2,.8,.25,1),coinspin 7s linear .9s infinite reverse}
@keyframes coinspin{from{transform:rotateX(-14deg) rotateY(0)}to{transform:rotateX(-14deg) rotateY(360deg)}}
@keyframes coinflip{0%{transform:rotateX(-14deg) rotateY(0) translateY(0) scale(1)}35%{transform:rotateX(-14deg) rotateY(360deg) translateY(-26px) scale(1.2)}100%{transform:rotateX(-14deg) rotateY(900deg) translateY(0) scale(1)}}
.tv b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.15;text-shadow:0 2px 4px #000;transform:translateZ(14px)}
#teams .grid{transform:perspective(900px) rotateX(5deg);transform-origin:50% 0}
.card.pop{animation:cardflip .7s cubic-bezier(.2,.9,.25,1.1)}
@keyframes cardflip{0%{transform:rotateY(0) translateY(0)}45%{transform:rotateY(180deg) translateY(-10px) scale(1.14)}100%{transform:rotateY(360deg) translateY(-5px) scale(1.06)}}

.grid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:8px 4px 14px;align-content:start;scrollbar-width:none}
.grid.two{grid-template-columns:repeat(2,1fr);gap:12px 10px;flex:none;overflow:visible}
.card{position:relative;aspect-ratio:240/271;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;text-align:center;padding:15% 11% 11%;line-height:1.1;transition:transform .22s cubic-bezier(.2,1.3,.3,1),filter .2s}
.card::before{content:"";position:absolute;inset:0;z-index:0;background:url(assets/ui/sq2.webp) center/100% 100% no-repeat;filter:drop-shadow(0 7px 8px rgba(0,0,0,.55));transition:filter .2s}
.card>*{position:relative;z-index:1}
.card img{width:64%;aspect-ratio:1;object-fit:contain;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.card span{display:block;margin-top:3px;min-height:20px;overflow:hidden;color:#efe5ff;text-shadow:0 1px 3px #000}
.card.lux::before{filter:sepia(1) saturate(2.4) hue-rotate(5deg) brightness(.95) drop-shadow(0 7px 8px rgba(0,0,0,.55))}.card.lux span{color:#ffe08a}
.card.gal::before{filter:hue-rotate(55deg) saturate(1.5) drop-shadow(0 7px 8px rgba(0,0,0,.55))}.card.gal span{color:#ffb3d9}
.card.sel{transform:translateY(-5px) scale(1.06)}
.card.sel::before{filter:brightness(1.35) saturate(1.3) drop-shadow(0 0 5px var(--gold)) drop-shadow(0 0 12px var(--gold))}
.card.tk{opacity:.32}
.card:active{transform:scale(.95)}
.card canvas{position:static!important;width:80%!important;height:auto!important;border-radius:8px;margin-bottom:3px;display:block}
.card b{display:block;font-size:13px;color:var(--gold);text-shadow:0 1px 3px #000}
.card.fc{aspect-ratio:auto;padding:8px 8px 8px;border-radius:18px}
.card.fc::before{background:linear-gradient(160deg,rgba(60,30,130,.85),rgba(14,6,44,.95));border:2px solid rgba(170,120,255,.5);border-radius:18px;filter:drop-shadow(0 7px 8px rgba(0,0,0,.5))}
.card.fc.sel::before{border-color:var(--gold);filter:drop-shadow(0 0 10px var(--gold))}
.card.fc img.f{width:100%;height:118px;aspect-ratio:auto;object-fit:cover;object-position:50% 45%;border-radius:11px;margin-bottom:5px}
.card.fc b{font-size:12px}
.balls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 4px 12px}
.bcard{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:19%;background:url(assets/ui/t_knob.webp) center/100% 100% no-repeat;filter:drop-shadow(0 7px 8px rgba(0,0,0,.55));transition:transform .22s cubic-bezier(.2,1.3,.3,1)}
.bcard img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.bcard.sel{background-image:url(assets/ui/ring.webp);transform:translateY(-4px) scale(1.12);padding:22%;filter:drop-shadow(0 0 12px rgba(66,217,255,.8))}

/* ---------- settings ---------- */
.panel.st{flex:none;gap:16px;align-items:stretch;padding:20px 16px 18px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:15px;color:#efe5ff;text-shadow:0 2px 4px #000a;padding:6px 6px}
.dots{display:flex;gap:10px}
.dot{width:58px;height:58px;font-size:22px;padding-bottom:3px;text-shadow:0 2px 4px #000;background:url(assets/ui/d_grey.webp) center/contain no-repeat;filter:brightness(.78) drop-shadow(0 6px 8px rgba(0,0,0,.5));transition:transform .22s cubic-bezier(.2,1.3,.3,1),filter .2s}
.dot.on{filter:none;transform:translateY(-4px) scale(1.14);filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.dot[data-lim="3"].on{background-image:url(assets/ui/d_green.webp)}.dot[data-lim="5"].on{background-image:url(assets/ui/d_cyan.webp)}.dot[data-lim="7"].on{background-image:url(assets/ui/d_orange.webp)}
.tg{width:104px;height:40px;background:url(assets/ui/t_off.webp) center/100% 100% no-repeat;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5));transition:.2s}.tg.on{background-image:url(assets/ui/t_on.webp);filter:drop-shadow(0 0 12px rgba(120,90,255,.7))}

/* ---------- main menu : floating, suspended, soft ---------- */
#menu{background-image:url(assets/ui/bg_menu.jpg);justify-content:space-between;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.px{transform:translate3d(calc(var(--px,0)*var(--d,10)*-1px),calc(var(--py,0)*var(--d,10)*-.6px),0);transition:transform .35s ease-out;will-change:transform}
.lgw{display:flex;flex-direction:column;align-items:center;flex:none}
.logo{width:min(70vw,290px);display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(150,80,255,.5));animation:bob 5s ease-in-out infinite;will-change:transform}
.tag{margin-top:4px;font-size:10px;letter-spacing:4px;color:#d9c6ff;text-shadow:0 2px 6px #000}
.stage{flex:1;min-height:0;width:100%;max-width:460px;display:flex;align-items:center;justify-content:center;gap:2vw}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 0 22px;color:#fff}
.slot b{display:block;max-width:29vw;font-size:11px;text-align:center;line-height:1.1;text-shadow:0 2px 6px #000,0 0 10px rgba(150,90,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.slot .fl{position:relative;width:min(27vw,118px);aspect-ratio:1;display:grid;place-items:center;will-change:transform}
.slot .fl img{position:relative;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.65))}
.fl.a{animation:bob 4.4s ease-in-out infinite}.fl.b{animation:bob 4.4s ease-in-out -2.2s infinite}.fl.c{animation:bob 3.6s ease-in-out -1s infinite}
.slot .rg{position:absolute;inset:0;background:url(assets/ui/ring.webp) center/contain no-repeat;opacity:.9;animation:spin 26s linear infinite;filter:drop-shadow(0 0 12px rgba(120,80,255,.7))}
.slot .sh{left:16%;right:16%;bottom:28px;height:16px}
.vc .fl{width:min(30vw,128px)}
.vc .fl img{width:100%;height:100%;animation:spin 18s linear infinite;filter:drop-shadow(0 16px 16px rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(150,90,255,.5))}
.vc .sh{bottom:12px;left:10%;right:10%}
.vc em{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-style:normal;font-size:22px;color:var(--gold);text-shadow:0 0 14px #ff9a1f,0 2px 0 #3a1500;z-index:2}
.dock{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.play{position:relative;width:min(74vw,290px);aspect-ratio:2.8;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 0 6px;background:url(assets/ui/pill_pink.webp) center/100% 100% no-repeat;font-size:26px;letter-spacing:4px;text-shadow:0 3px 6px #5a0050,0 0 16px #ff7bf0;animation:bob2 3.6s ease-in-out infinite,pulse 2.8s ease-in-out infinite;transition:scale .15s}
.play img{width:44px;height:48px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.play:active{scale:.95}
.orbs{display:flex;justify-content:center;gap:1.4vw;width:100%}
.orb{width:min(18.4vw,78px);display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:var(--y,0);animation:bob2 4s ease-in-out calc(var(--i)*-.8s) infinite;transition:scale .15s,opacity .2s,filter .2s}
.orb img{width:100%;display:block;filter:drop-shadow(0 9px 10px rgba(0,0,0,.7))}
.orb b{font-size:8.5px;letter-spacing:.5px;color:#eadfff;text-shadow:0 2px 5px #000,0 0 8px rgba(150,90,255,.8);white-space:nowrap}
.orb:active{scale:.9}
.orb.dis{opacity:.4;filter:grayscale(.7)}
@media(max-height:700px){.logo{width:min(56vw,230px)}.tag{display:none}.play{width:min(62vw,240px)}.slot .fl{width:min(23vw,98px)}.vc .fl{width:min(26vw,108px)}.orb img{transform:scale(.9)}}
@media(min-width:700px){.stage{max-width:620px}.slot .fl{width:150px}.vc .fl{width:170px}.orb{width:92px}.orb b{font-size:10px}}
.panel.fit{flex:none;padding-bottom:16px}
.panel.fit .grid{flex:none}
.slot{gap:0}.slot b{margin-top:2px}

</style></head><body><canvas id="bgc"></canvas><canvas id="game"></canvas>

</div></div>

<div class="scr show" id="menu">
 <div class="px lgw" style="--d:7"><img class="logo bob" src="assets/ui/logo.webp" alt="NX GAME"><div class="tag">Nexora · Disc Football</div></div>

function restart(){score=[0,0];$('s1').textContent=$('s2').textContent='0';$('over').classList.remove('show');reset(0);saveMatch()}
let fr=0;const busy=()=>phase!=='aim'||drag||parts.length||rings.length||trail.length||flash>.01||cam>.01||shake[0]>0||shake[1]>0;
function loop(t){const dt=Math.min((t-last)/1000||.016,.05);last=t;
 if(!menuOpen){let ts=1;if(freeze>0){freeze-=dt;ts=0}else if(slow>0){slow-=dt;ts=.32+.68*Math.pow(1-Math.max(0,slow)/1.1,2)}acc+=dt*ts;let n=0;
  if(phase!=='over'){while(acc>=STEP&&n++<14){sim(STEP);acc-=STEP}if(n>14)acc=0}
  if(phase==='move'){idle=bodies.some(b=>b.vx||b.vy)?0:idle+dt;if(idle>.25){turn=1-turn;phase='aim';stat();saveMatch()}}
  else if(phase==='goal'){pause-=dt;if(pause<=0){if(score[0]>=SET.lim||score[1]>=SET.lim)end();else reset(kick)}}
  if(ball&&Math.hypot(ball.vx,ball.vy)>350*K)trail.push({x:ball.x,y:ball.y,a:1,h:Math.hypot(ball.vx,ball.vy)>1250*K})}
 flash=Math.max(0,flash-dt*2);cam=Math.max(0,cam-dt*3.2);for(const r of rings)r.l-=dt;rings=rings.filter(r=>r.l>0);shake[0]=Math.max(0,shake[0]-dt);shake[1]=Math.max(0,shake[1]-dt);
 {let k=0;for(let i=0;i<trail.length;i++){const p=trail[i];p.a-=dt*3;if(p.a>0)trail[k++]=p}trail.length=k}
 {let k=0;for(let i=0;i<parts.length;i++){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt;if(p.l>0)parts[k++]=p}parts.length=k}
 if(!menuOpen&&(busy()||(fr++&1)))draw();requestAnimationFrame(loop)}
// ---------- ورودی لمسی ----------
const pt=e=>({x:(e.clientX-ox)/s,y:(e.clientY-oy)/s});
const inUI=e=>e.target.closest&&e.target.closest('button,.scr,.over');
document.addEventListener('pointerdown',e=>{if(AC&&AC.state==='suspended')AC.resume();if(menuOpen||phase!=='aim'||inUI(e))return;const p=pt(e);let f=null,bd=1e9;
 for(const b of bodies)if(b.team===turn){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<b.r+30&&d<bd){f=b;bd=d}}
 if(!f)return;drag={b:f,s:p,c:p};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(drag){drag.c=pt(e);e.preventDefault()}});
document.addEventListener('pointerup',e=>{if(!drag)return;const{b,s:p0,c}=drag,dx=p0.x-c.x,dy=p0.y-c.y,l=Math.hypot(dx,dy);drag=null;
 if(l>18){const v=(150+1350*Math.min(l,LMAX)/LMAX)*K;b.vx=dx/l*v;b.vy=dy/l*v;phase='move';idle=0;shots++;stat();tone(330,.05,'triangle',.12,190)}e.preventDefault()});
document.addEventListener('pointercancel',()=>{drag=null});
// ---------- منو و صفحه‌ها ----------
function show(id){for(const e of document.querySelectorAll('.scr'))e.classList.toggle('show',e.id===id);menuOpen=!!id;
 if(id==='menu'){const sm=(()=>{try{return !!localStorage.getItem(MATCH_KEY)}catch(e){return false}})();$('mcont').classList.toggle('dis',!((inMatch||sm)&&phase!=='over'));$('mplay').querySelector('.lbl').textContent=inMatch?'New match':'Play'}sfx('ui');musicSync()}
let tab=0,ftab=0,cat=0,popId=null;
for(const t of[0,1]){const c=$('co'+t);for(let k=-4;k<=4;k++){const e=document.createElement('i');e.style.setProperty('--k',k);c.insertBefore(e,c.firstChild)}}
const flipCoin=t=>{const c=$('co'+t);c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip')};
function renderShop(){const g=$('grid'),cb=$('cats');$('tab0').classList.toggle('on',tab===0);$('tab1').classList.toggle('on',tab===1);$('tab0').textContent='Home';$('tab1').textContent='Away';
 if(!cb.children.length)CATS.forEach(([k,l],i)=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.onclick=()=>{cat=i;renderShop();g.scrollTop=0};cb.appendChild(b)});
 [...cb.children].forEach((b,i)=>b.classList.toggle('on',i===cat));
 for(const t of[0,1]){$('tvi'+t).src=$('tvj'+t).src=T(sel[t]).src;$('tvn'+t).textContent=nm(t);$('tv'+t).classList.toggle('on',tab===t)}
 g.innerHTML='';
 for(const t of TEAMS){if(t.cat!==CATS[cat][0])continue;const c=document.createElement('button');c.className='card'+(t.cat==='lux'?' lux':t.cat==='gal'?' gal':'')+(sel[tab]===t.id?' sel':'')+(sel[1-tab]===t.id?' tk':'')+(popId===t.id?' pop':'');c.innerHTML='<img loading="lazy" src="'+t.src+'" alt=""><span>'+t.name+'</span>';
  c.onclick=()=>{if(sel[1-tab]===t.id)return;sel[tab]=t.id;popId=t.id;img(t.id);store('nexora_teams',sel);ui();renderShop();popId=null;flipCoin(tab);build();sfx('ui')};g.appendChild(c)}}
function renderForms(){$('ftab0').classList.toggle('on',ftab===0);$('ftab1').classList.toggle('on',ftab===1);$('ftab0').textContent='Team 1: '+nm(0);$('ftab1').textContent='Team 2: '+nm(1);const g=$('fgrid');g.innerHTML='';
 FORMS.forEach((f,i)=>{const c=document.createElement('button'),cv=document.createElement('canvas');cv.width=120;cv.height=100;c.className='card'+(form[ftab]===i?' sel':'');
  const x=cv.getContext('2d');x.fillStyle='#237a2f';rr(x,2,2,116,96,10);x.fill();x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2;rr(x,2,2,116,96,10);x.stroke();
  x.beginPath();x.moveTo(2,2);x.lineTo(118,2);x.stroke();x.beginPath();x.arc(60,2,16,0,3.1416);x.stroke();x.strokeRect(34,66,52,32);
  for(const[nx,ny]of slots(i)){x.fillStyle=RING[ftab];x.beginPath();x.arc(14+nx*92,92-ny/.5*80,8,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}
  c.appendChild(cv);c.insertAdjacentHTML('beforeend','<b>'+f[0]+'</b><span>'+f[1]+'</span>');
  c.onclick=()=>{form[ftab]=i;store('nexora_form',form);renderForms();sfx('ui')};g.appendChild(c)})}
function applyField(){geo();SPR.goal=null;lg(SET.fld);load('f'+SET.fld,fsrc(SET.fld));ui();build();reset(turn)}
function renderFields(){const g=$('fldgrid'),bl=$('ballgrid');g.innerHTML=bl.innerHTML='';
 FIELDS.forEach((f,i)=>{const c=document.createElement('button');c.className='card fc'+(SET.fld===i?' sel':'');c.innerHTML='<img class="f" loading="lazy" decoding="async" src="'+tsrc(i)+'" alt=""><b>'+f.name+'</b>';
  c.onclick=()=>{if(SET.fld===i)return;SET.fld=i;store('nexora_set',SET);if(inMatch){score=[0,0];$('s1').textContent=$('s2').textContent='0';$('over').classList.remove('show')}applyField();renderFields();sfx('ui')};g.appendChild(c)});
 for(let i=0;i<NB;i++){const c=document.createElement('button');c.className='bcard'+(SET.ball===i?' sel':'');c.innerHTML='<img src="assets/balls/s'+i+'.webp" alt="" decoding="async">';
  c.onclick=()=>{SET.ball=i;store('nexora_set',SET);load('ball'+i,'assets/balls/b'+i+'.png');ui();build();renderFields();sfx('ui')};bl.appendChild(c)}}
function renderSets(){for(const b of document.querySelectorAll('[data-lim]'))b.classList.toggle('on',+b.dataset.lim===SET.lim);
 $('setsnd').classList.toggle('on',!!SET.snd);$('setvib').classList.toggle('on',!!SET.vib);$('bsnd').classList.toggle('off',!SET.snd)}
$('mplay').onclick=()=>{restart();inMatch=true;show(null)};$('mcont').onclick=()=>{if($('mcont').classList.contains('dis'))return;if(!loadMatch()){inMatch=true}show(null)};
$('mteam').onclick=()=>{cat=catOf(sel[tab]);renderShop();show('teams')};$('mform').onclick=()=>{renderForms();show('forms')};$('mfield').onclick=()=>{renderFields();show('fields')};$('mset').onclick=()=>{renderSets();show('sets')};
for(const b of document.querySelectorAll('[data-back]'))b.onclick=()=>show('menu');
for(const t of[0,1])$('vt'+t).onclick=()=>{tab=t;cat=catOf(sel[t]);renderShop();show('teams')};
$('vc').onclick=()=>{renderFields();show('fields')};
{const mn=$('menu'),tm=$('teams');document.addEventListener('pointermove',e=>{const m=mn.classList.contains('show')?mn:tm.classList.contains('show')?tm:null;if(!m)return;m.style.setProperty('--px',(e.clientX/innerWidth*2-1).toFixed(3));m.style.setProperty('--py',(e.clientY/innerHeight*2-1).toFixed(3))},{passive:true})}
$('tab0').onclick=()=>{tab=0;cat=catOf(sel[0]);renderShop()};$('tab1').onclick=()=>{tab=1;cat=catOf(sel[1]);renderShop()};$('ftab0').onclick=()=>{ftab=0;renderForms()};$('ftab1').onclick=()=>{ftab=1;renderForms()};
for(const b of document.querySelectorAll('[data-lim]'))b.onclick=()=>{SET.lim=+b.dataset.lim;store('nexora_set',SET);renderSets();sfx('ui')};
$('setsnd').onclick=$('bsnd').onclick=()=>{SET.snd=SET.snd?0:1;store('nexora_set',SET);renderSets();sfx('ui');musicSync()};
$('setvib').onclick=()=>{SET.vib=SET.vib?0:1;store('nexora_set',SET);renderSets();vib(30)};
$('bmenu').onclick=()=>show('menu');$('reset').onclick=()=>{restart();inMatch=true;sfx('ui')};$('again').onclick=()=>{restart();inMatch=true};$('ovm').onclick=()=>show('menu');
window.addEventListener('resize',build);window.addEventListener('pagehide',saveMatch);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveMatch();musicSync()});document.addEventListener('pointerdown',()=>musicSync(),{passive:true});
loadAll();loadSnd();ui();renderSets();show('menu');
Promise.all(Object.values(IMG).map(im=>new Promise(r=>{if(im.complete)r();else{im.onload=im.onerror=r}}))).then(()=>{build();reset(0);requestAnimationFrame(loop)});
})();
</script></body></html>
