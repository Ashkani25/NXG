services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo_data:/data/db"]
  server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on: [mongo]
    ports: ["2567:2567"]
volumes:
  mongo_data:
