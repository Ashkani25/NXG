name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Download Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        rm cmdline-tools.zip
        echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/android/local.properties
    
    - name: Install Android SDK components
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses 2>/dev/null || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
    
    - name: Create local.properties
      run: echo "sdk.dir=$HOME/android-sdk" > android/local.properties
    
    - name: Install npm dependencies
      run: npm install
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      continue-on-error: true
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build.log
        retention-days: 7
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: bermuda-nxg-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
